; Avatar Chat for PS3. Lives next to EBOOT.BIN in the app's USRDIR
; (/dev_hdd0/game/AVCH00001/USRDIR/avatar_chat_ps3.ini); the host build
; reads it from $AVATAR_CHAT_DIR or the current directory.

; Chat server. The public one is futureland.today:10088; a self-hosted
; avatar_chat_server works the same. The PS3 resolves names with the
; system DNS; an IP address also works.
host = futureland.today
port = 10088

; Your handle. Leave empty to be asked at startup (needs a USB keyboard).
nick =

; What other users see as your board. Shows after your name.
system = PS3

; Room to open in.
channel = main

; Avatar: a .bin file next to this ini, one 120-byte avatar or a
; collection (AVATARS.md in avatar_chat_universal). avatar_index picks
; one out of a collection, counting from 0.
avatar = avatar.bin
avatar_index = 0

; Messages of history to load when joining a room (0-100).
history = 40

; Start in compact mode (one line per message, no avatars). Select toggles.
compact = off

; Pictures: download image links in messages and draw them under the
; text. ssl_verify checks HTTPS certificates against a cacert.pem next
; to this file (e.g. https://curl.se/ca/cacert.pem); with no such file,
; or ssl_verify off, pictures over HTTPS are fetched without checking.
images = on
ssl_verify = on

; Link preview cards for the first plain link in a message.
link_previews = on

; Words that veil pictures and cards until /nsfw (comma separated; "none"
; turns the veil off). Empty uses the shell's default list.
nsfw_keywords =

; Keyboard for the pad (Triangle, or Cross on an empty line): "builtin"
; is a keyboard drawn by the app and always works; "system" tries the
; console's own on-screen keyboard dialog first and falls back to the
; built-in one if it fails.
osk = builtin

; Screen: percent of each edge kept clear for TV overscan (0-15), and the
; font scale (0 = auto: about 80 columns at any resolution).
overscan = 5
scale = 0
