# Host build and core tests on every push; the PS3 target is built in the
# ps3dev toolchain container so a broken PS3 build shows up here too.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host client
        run: make -f Makefile.host
      - name: Core tests
        run: make -f Makefile.host test
      - name: Syntax-check the PS3 platform file
        run: make -f Makefile.host check-ps3

  ps3:
    runs-on: ubuntu-latest
    container: ps3dev/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EBOOT and pkg
        run: |
          export PS3DEV=/usr/local/ps3dev
          export PSL1GHT=$PS3DEV
          export PATH=$PATH:$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin
          make pkg
      - uses: actions/upload-artifact@v4
        with:
          name: avatar_chat_ps3
          path: |
            avatar_chat_ps3.self
            avatar_chat_ps3.pkg
          if-no-files-found: error
