# Every push: build and test the host client, then build the real PS3
# target in the ps3dev toolchain container and keep the .self and .pkg as
# workflow artifacts. Tagged releases are built by release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host client
        run: make -f Makefile.host
      - name: Core tests
        run: make -f Makefile.host test
      - name: Syntax-check the PS3 platform file
        run: make -f Makefile.host check-ps3

  ps3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the ps3dev toolchain
        run: .github/scripts/build-ps3.sh
      - uses: actions/upload-artifact@v4
        with:
          name: avatar_chat_ps3-${{ github.sha }}
          path: |
            avatar_chat_ps3.self
            avatar_chat_ps3.pkg
            avatar_chat_ps3.ini
            avatar_chat_ps3.elf
            avatar_chat_ps3.elf.map
          if-no-files-found: error
